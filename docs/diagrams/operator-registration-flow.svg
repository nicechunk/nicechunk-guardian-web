<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Operator registration flow</title>
  <desc id="desc">A diagram showing how the Guardian Web UI moves from wallet connection and region preview to transaction preparation, registry state, and endpoint discovery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081018"/><stop offset="1" stop-color="#13160d"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#8fdcff"/></marker>
    <style>.label{font:800 12px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.16em;fill:#90ff1a}.title{font:850 42px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f3f8ff}.copy{font:500 17px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b8c7d4}.card{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.16);stroke-width:1.2;rx:18}.head{font:800 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f3f8ff}.small{font:600 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#bdd0df}.mono{font:750 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f7d98f}.line{stroke:#8fdcff;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="70" y="78" class="label">OPERATOR WORKFLOW</text>
  <text x="70" y="132" class="title">Registration should be previewed before signing.</text>
  <text x="70" y="168" class="copy">The operator UI makes program IDs, region bounds, endpoint choices, and treasury accounts visible before transaction preparation.</text>
  <g transform="translate(82 280)"><rect class="card" width="190" height="154"/><text x="24" y="42" class="head">Wallet</text><text x="24" y="78" class="small">operator identity</text><text x="24" y="108" class="mono">signer</text></g>
  <path class="line" d="M272 356 H344"/>
  <g transform="translate(366 250)"><rect class="card" width="230" height="214"/><text x="24" y="42" class="head">Region preview</text><text x="24" y="78" class="small">center chunk</text><text x="24" y="108" class="small">bounds</text><text x="24" y="138" class="small">host and port</text><text x="24" y="168" class="small">TLS mode</text></g>
  <path class="line" d="M596 356 H668"/>
  <g transform="translate(690 250)"><rect class="card" width="230" height="214"/><text x="24" y="42" class="head">Transaction</text><text x="24" y="78" class="small">register Guardian</text><text x="24" y="108" class="small">stake treasury</text><text x="24" y="138" class="small">registry PDA</text><text x="24" y="168" class="mono">sdk helper</text></g>
  <path class="line" d="M920 356 H992"/>
  <g transform="translate(1014 280)"><rect class="card" width="190" height="154"/><text x="24" y="42" class="head">Discovery</text><text x="24" y="78" class="small">active region</text><text x="24" y="108" class="small">client routing</text></g>
  <text x="350" y="604" class="copy">The UI makes account and endpoint choices explicit before a wallet prompt appears.</text>
</svg>
